# Эксперимент: экспоненциальные sample_weight по давности (поверх v7).
# w = 2 ** (-age_months / half_life); якорь = train_end (2015-12).
random_seed: 42

data:
  raw_path: data/raw/train_ver2.csv
  processed_dir: data/processed
  datasets_dir: datasets
  target_prefix: ind_
  target_suffix: _ult1
  chunksize: 400000
  clients_per_month_train: 100000
  clients_per_month_valid: 133333

split:
  train_end: "2015-12-28"
  valid_end: "2016-04-28"

features:
  portfolio_lags: []

model:
  type: lightgbm
  params:
    n_estimators: 300
    learning_rate: 0.05
    num_leaves: 63
    subsample: 0.8
    colsample_bytree: 0.8
  top_k: 7
  use_scale_pos_weight: false
  scale_pos_weight_mode: sqrt
  scale_pos_weight_cap: 50
  min_positives_train: 100
  early_stopping:
    enabled: true
    holdout_months: 1
    patience: 20
  time_weights:
    enabled: true
    half_life_months: 3
    # ближе к валидации: вес относительно конца train
    anchor: "2015-12-28"

mlflow:
  experiment_name: bank-product-recommender
  tracking_uri: http://127.0.0.1:5000
  train_run_name: bank-rec-train-009-time-weights

paths:
  model_path: models/model_time_weights.bin
  metrics_path: models/metrics_time_weights.json
